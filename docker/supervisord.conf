[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/dlr/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/dlr/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/dlr/supervisor.sock

; ---------------------------------------------------------------- 录制主进程
[program:recorder]
directory=/app
command=python -u main.py
autostart=true
autorestart=true
startsecs=5
startretries=20
; 收到停止信号时先让 ffmpeg 安全收尾，再退出
stopsignal=TERM
stopwaitsecs=40
stdout_logfile=/app/logs/recorder.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
environment=DLR_NO_CLEAR="1",DLR_NONINTERACTIVE="1",PYTHONUNBUFFERED="1",TERM="xterm-256color"

; ---------------------------------------------------------------- WebUI
[program:webui]
directory=/app
command=python -m uvicorn webui.app:app --host 0.0.0.0 --port %(ENV_WEBUI_PORT)s --no-access-log --log-level warning
autostart=true
autorestart=true
startsecs=3
startretries=999
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/app/logs/webui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",WEBUI_PORT="%(ENV_WEBUI_PORT)s"
