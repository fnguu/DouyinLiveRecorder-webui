name: Build WebUI Image

# 推到仓库后自动构建镜像并发布到 GitHub Container Registry：
#   ghcr.io/<用户名>/<仓库名>:latest
# 也可在 Actions 页面手动触发，并指定目标平台。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建平台（默认 linux/amd64；要 ARM 填 linux/amd64,linux/arm64，会慢很多）'
        required: false
        default: 'linux/amd64'

env:
  # 镜像名固定在仓库名之外，仓库改名不会导致镜像地址变化
  IMAGE_NAME: ${{ github.repository_owner }}/douyin-live-recorder-webui

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          build-args: |
            BUILD_TIME=${{ steps.meta.outputs.created }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
